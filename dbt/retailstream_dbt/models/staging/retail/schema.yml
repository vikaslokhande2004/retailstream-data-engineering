version: 2

models:

  - name: stg_categories
    description: "Cleaned category records from the retail source."
    columns:
      - name: category_id
        tests:
          - not_null
          - unique

  - name: stg_customers
    description: "Cleaned customer records from the retail source."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Cleaned product records from the retail source."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: "Cleaned order records from the retail source."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_order_items
    description: "Cleaned order item records."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_payments
    description: "Cleaned payment records."
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_returns
    description: "Cleaned return records."
    columns:
      - name: return_id
        tests:
          - not_null
          - unique

      - name: order_item_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_order_items')
                field: order_item_id