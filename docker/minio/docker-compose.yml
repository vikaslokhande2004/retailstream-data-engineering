services:
  minio:
    image: rustfs/rustfs:latest
    container_name: retailstream-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_ACCESS_KEY: retailadmin
      RUSTFS_SECRET_KEY: retailstream123
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data

volumes:
  rustfs_data:
