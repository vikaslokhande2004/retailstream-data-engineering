services:
  postgres:
    image: postgres:16
    container_name: retailstream-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: retail_dw
      POSTGRES_USER: retailadmin
      POSTGRES_PASSWORD: retailstream123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: